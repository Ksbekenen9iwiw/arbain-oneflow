<div class="order-line"{% if line_form.DELETE.value %} hidden{% endif %}>{{ line_form.non_field_errors }}<div class="line-fields"><div class="field product-field">{{ line_form.product.label_tag }}{{ line_form.product }}{{ line_form.product.errors }}</div><div class="field quantity-field">{{ line_form.quantity.label_tag }}{{ line_form.quantity }}{{ line_form.quantity.errors }}</div><button type="button" class="text-button remove-line" aria-label="Hapus baris produk" title="Hapus produk">×</button></div><div class="line-preview"><span class="line-stock">Pilih produk untuk melihat harga dan stok.</span><strong class="line-subtotal">—</strong></div><span class="delete-field">{{ line_form.DELETE }}</span></div>
