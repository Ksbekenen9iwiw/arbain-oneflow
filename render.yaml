databases:
  - name: oneflow-db
    plan: free
    region: singapore
    databaseName: oneflow
    user: oneflow
    # Kosong berarti tidak ada IP luar yang boleh masuk. Layanan di akun ini tetap bisa.
    ipAllowList: []

services:
  - type: web
    name: oneflow
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oneflow-db
          property: connectionString
      - key: ONEFLOW_DEBUG
        value: "0"
      - key: ONEFLOW_SECRET_KEY
        generateValue: true
      - key: ONEFLOW_DEMO
        value: "1"
